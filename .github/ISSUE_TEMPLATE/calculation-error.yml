name: Incorrect calculation
description: TDS Calculator returns a figure you believe is statutorily wrong.
title: "[calc] "
labels: ["bug", "calculation"]
body:
  - type: markdown
    attributes:
      value: |
        A wrong statutory figure is the most important kind of bug this package
        can have, so thank you for reporting it.

        The single most useful thing you can give us is **the rule that says we
        are wrong**. Inputs plus expected output plus a citation becomes a test
        case, and a test case becomes a fix.

        This tool implements:

        > Income-tax Act 1961, section 192 read with section 115BAC, on the FY 2025-26 slabs given by the Finance Act 2025, including the section 87A rebate with its marginal relief and section 288B rounding.

  - type: input
    id: version
    attributes:
      label: Package version
      placeholder: "crmleaf/tds-calculator 1.0.0"
    validations:
      required: true

  - type: input
    id: financial-year
    attributes:
      label: Financial year the figure applies to
      placeholder: "2025-26"
    validations:
      required: true

  - type: textarea
    id: inputs
    attributes:
      label: Inputs
      description: Every value you passed. Code is ideal.
      render: php
      placeholder: |
        (new TdsCalculator())->calculate(
        monthlyGross: Money::fromRupees(100_000),
        regime: 'new',
        );
    validations:
      required: true

  - type: input
    id: actual
    attributes:
      label: Figure you got
    validations:
      required: true

  - type: input
    id: expected
    attributes:
      label: Figure you expected
    validations:
      required: true

  - type: textarea
    id: citation
    attributes:
      label: Statutory basis for the expected figure
      description: >
        The section, notification, circular or gazette entry. A link is perfect.
        If you are working from an accountant's advice or a filing that was
        accepted, say so - that is still useful evidence, just tell us which it is.
    validations:
      required: true
